        /* ✨ START: NEW CSS TO MOVE PAGINATION ✨ */

        /* Give the main image container some bottom padding to make space for the dots */
        .unit-card .unit-img {
            position: relative; /* Keeps arrows positioned correctly relative to the image */
            padding-bottom: 35px; /* Adjust this value to add more or less space */
        }

        /* Move the pagination element out of the image area and into the new space */
        .unit-card .unit-img .swiper-pagination {
            position: static; /* Puts the element back in the normal document flow */
            margin-top: 15px; /* Adds space between the slider image and the dots */
        }

        /* ✨ END: NEW CSS TO MOVE PAGINATION ✨ */


        /* Style the navigation arrows */
        .unit-card .unit-img .swiper-button-next,
        .unit-card .unit-img .swiper-button-prev {
            background-color: white;
            border-radius: 50%;
            width: 40px !important;
            height: 40px !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        /* Adjust the size of the arrow icon inside the circle */
        .unit-card .unit-img .swiper-button-next::after,
        .unit-card .unit-img .swiper-button-prev::after {
            font-size: 14px !important;
            font-weight: bold;
            color: #00263D !important;
        }
        
        /* Style for all pagination bullets */
        .unit-card .unit-img .swiper-pagination-bullets .swiper-pagination-bullet {
            background: #00263D !important;
            opacity: 0.2; /* Make inactive dots slightly transparent */
        }

        /* Style for the active pagination bullet */
        .unit-card .unit-img .swiper-pagination-bullets .swiper-pagination-bullet.swiper-pagination-bullet-active {
            background: #00263D !important;
            opacity: 1;
        }

    <style>/* Container */

.imp-tooltips-container {
  position: relative;
  z-index: 999997;
}

/* Tooltip */

.imp-tooltip-wrap {
  position: absolute;
  pointer-events: none;
  height: 0;
}
.imp-tooltip-wrap {
  pointer-events: none;
}
.imp-tooltip-wrap .imp-tooltip {
  display: none;
  position: relative;
  pointer-events: all;
  opacity: 0;

  transition-duration: 0.2s;
  -moz-transition-duration: 0.2s;
  -webkit-transition-duration: 0.2s;

  transition-timing-function: cubic-bezier(0.55, 0, 0.1, 1);
  -moz-transition-timing-function: cubic-bezier(0.55, 0, 0.1, 1);
  -webkit-transition-timing-function: cubic-bezier(0.55, 0, 0.1, 1);

  box-sizing: border-box;
  -moz-box-sizing: border-box;
  -webkit-box-sizing: border-box;
}

/* Arrow */

.hs-arrow {
  position: absolute;
}

.hs-arrow-top {
  left: 50%;
  top: 0;
  margin-left: -8px;
  margin-top: -8px;
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;

  border-bottom: 8px solid black;
}

.hs-arrow-bottom {
  left: 50%;
  top: 100%;
  margin-left: -8px;
  margin-top: 0;
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;

  border-top: 8px solid black;
}

.hs-arrow-right {
  left: 100%;
  top: 50%;
  margin-left: 0;
  margin-top: -8px;
  width: 0;
  height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;

  border-left: 8px solid black;
}

.hs-arrow-left {
  left: 0;
  top: 50%;
  margin-left: -8px;
  margin-top: -8px;
  width: 0;
  height: 0;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;

  border-right: 8px solid black;
}

/* Animation */

.imp-tooltip-wrap.imp-tooltip-position-top .imp-tooltip {
  transform-origin: 50% 100%;
}
.imp-tooltip-wrap.imp-tooltip-position-bottom .imp-tooltip {
  transform-origin: 50% 0%;
}
.imp-tooltip-wrap.imp-tooltip-position-left .imp-tooltip {
  transform-origin: 100% 50%;
}
.imp-tooltip-wrap.imp-tooltip-position-right .imp-tooltip {
  transform-origin: 0% 50%;
}
</style>

    <style>
  /* Smart Scroll Button with Water and Bounce Effects */
#smart-scroll-button {
    /* CSS variable for the water level, controlled by JavaScript */
    --water-level: 100%;

    position: fixed;
    bottom: 180px;
    right: 10px;
    width: 45px;
    height: 45px;
    background-color: #A68543;
    color: white;
    border-radius: 50%;
    cursor: pointer;
    z-index: 9999;
    /* MODIFIED: Added 'bottom' for smooth position change */
    transition: transform 0.3s ease, bottom 0.3s ease-out;
    text-decoration: none;
    display: block;
    overflow: hidden; /* Crucial: Hides parts of the effect outside the circle */
    box-shadow: 0px 0px 25px -5px rgba(50, 88, 130, 0.4);
}

/* ADDED: New class to handle the lowered position */
#smart-scroll-button.is-lowered {
    bottom: 20px;
}

#smart-scroll-button:hover {
    transform: scale(1.1);
}

/* Style for the Arrow Icon (using ::before) */
#smart-scroll-button::before {
    content: '\2193'; /* Down arrow ↓ */
    position: relative;
    z-index: 2; /* Ensures arrow is ON TOP of the water */
    font-size: 24px;
    line-height: 45px; /* Vertically centers the arrow */
    text-align: center;
    display: block;
    text-shadow: 0 0 5px rgba(0,0,0,0.5); /* Makes arrow more visible */
}

/* Style for the "Scroll Up" arrow */
#smart-scroll-button.scroll-to-top::before {
    content: '\2191'; /* Up arrow ↑ */
}

/* The Water Effect (using ::after) */
#smart-scroll-button::after {
    content: '';
    position: absolute;
    z-index: 1; /* Sits below the arrow */
    opacity: .7;
    bottom: 0;
    left: -25%; /* Positioned to look like a wave */
    height: 100%;
    width: 150%;
    background: #00263D;
    border-radius: 40%;
    animation: waveEffect 5s ease-in-out alternate infinite;
    
    /* Moves the water up based on the CSS variable */
    transform: translateY(var(--water-level));
    transition: transform 0.5s ease-out;
}

/* Class to trigger the bounce animation */
#smart-scroll-button.is-bouncing {
    animation: bounce 0.4s ease-out;
}

/* Animation keyframes for the wave-like motion */
@keyframes waveEffect {
    to {
        transform: translateY(var(--water-level)) rotate(360deg);
    }
}

/* Animation keyframes for the bounce motion */
@keyframes bounce {
    0% { transform: translateY(0); }
    50% { transform: translateY(-15px); } /* Bounces up by 15px */
    100% { transform: translateY(0); }
}

/* Responsive adjustment for smaller screens */
@media screen and (max-width: 768px) {
    #smart-scroll-button {
        bottom: 200px;
        z-index: 100!important;
    }
    /* ADDED: Also adjust the lowered position on mobile if needed */
    #smart-scroll-button.is-lowered {
        bottom: 20px;
    }
}
</style>

/* Enhanced Pulse Animation with Color Change */
div[id^="image-map-pro-"] div[data-title="Spot"] {
  animation: colorPulse 2s infinite ease-in-out;
  transform-origin: center;
  will-change: transform, fill; /* Optimize for both properties */
}

@keyframes colorPulse {
  0%, 100% {
    transform: scale(1);
    fill: rgba(0,0,0,1); /* Returns to original color */
  }
  50% {
    transform: scale(1.3);
    fill: rgba(170, 121, 66, 1); /* Your specified color at peak pulse */
  }
}

/* Pause during interaction */
div[id^="image-map-pro-"].imp-interacting div[data-title="Spot"] {
  animation-play-state: paused;
}
</style>

/*
 * Universal Image Map Pro Artboard Transition (Flip Effect)
 */

/* Applies the transition to ANY image map canvas */
div[id^="image-map-pro-"] .imp-canvas {
  /* Animate transform changes over 0.6s */
  transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out !important;
  transform-style: preserve-3d;
  backface-visibility: hidden;
}

/* Current artboard flips out */
div[id^="image-map-pro-"] .imp-canvas.artboard-is-changing {
  transform: rotateY(90deg) !important;
  opacity: 0;
}

/* New artboard starts flipped */
div[id^="image-map-pro-"] .imp-canvas.artboard-new {
  transform: rotateY(-90deg) !important;
  opacity: 0;
}

/* Active artboard in normal position */
div[id^="image-map-pro-"] .imp-canvas.artboard-active {
  transform: rotateY(0) !important;
  opacity: 1;
}
</style>
