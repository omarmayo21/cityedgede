<style>
  /* Smart Scroll Button with Water and Bounce Effects */
#smart-scroll-button {
    /* CSS variable for the water level, controlled by JavaScript */
    --water-level: 100%;

    position: fixed;
    bottom: 180px;
    right: 10px;
    width: 45px;
    height: 45px;
    background-color: #A68543;
    color: white;
    border-radius: 50%;
    cursor: pointer;
    z-index: 9999;
    /* MODIFIED: Added 'bottom' for smooth position change */
    transition: transform 0.3s ease, bottom 0.3s ease-out;
    text-decoration: none;
    display: block;
    overflow: hidden; /* Crucial: Hides parts of the effect outside the circle */
    box-shadow: 0px 0px 25px -5px rgba(50, 88, 130, 0.4);
}

/* ADDED: New class to handle the lowered position */
#smart-scroll-button.is-lowered {
    bottom: 20px;
}

#smart-scroll-button:hover {
    transform: scale(1.1);
}

/* Style for the Arrow Icon (using ::before) */
#smart-scroll-button::before {
    content: '\2193'; /* Down arrow ↓ */
    position: relative;
    z-index: 2; /* Ensures arrow is ON TOP of the water */
    font-size: 24px;
    line-height: 45px; /* Vertically centers the arrow */
    text-align: center;
    display: block;
    text-shadow: 0 0 5px rgba(0,0,0,0.5); /* Makes arrow more visible */
}

/* Style for the "Scroll Up" arrow */
#smart-scroll-button.scroll-to-top::before {
    content: '\2191'; /* Up arrow ↑ */
}

/* The Water Effect (using ::after) */
#smart-scroll-button::after {
    content: '';
    position: absolute;
    z-index: 1; /* Sits below the arrow */
    opacity: .7;
    bottom: 0;
    left: -25%; /* Positioned to look like a wave */
    height: 100%;
    width: 150%;
    background: #00263D;
    border-radius: 40%;
    animation: waveEffect 5s ease-in-out alternate infinite;
    
    /* Moves the water up based on the CSS variable */
    transform: translateY(var(--water-level));
    transition: transform 0.5s ease-out;
}

/* Class to trigger the bounce animation */
#smart-scroll-button.is-bouncing {
    animation: bounce 0.4s ease-out;
}

/* Animation keyframes for the wave-like motion */
@keyframes waveEffect {
    to {
        transform: translateY(var(--water-level)) rotate(360deg);
    }
}

/* Animation keyframes for the bounce motion */
@keyframes bounce {
    0% { transform: translateY(0); }
    50% { transform: translateY(-15px); } /* Bounces up by 15px */
    100% { transform: translateY(0); }
}

/* Responsive adjustment for smaller screens */
@media screen and (max-width: 768px) {
    #smart-scroll-button {
        bottom: 200px;
        z-index: 100!important;
    }
    /* ADDED: Also adjust the lowered position on mobile if needed */
    #smart-scroll-button.is-lowered {
        bottom: 20px;
    }
}
</style>

<script>
    jQuery(document).ready(function($) {
    var scrollButton = $('#smart-scroll-button');
    var isBouncing = false;
    var footer = $('#main-footer-id');
    var megaMenuTrigger = $('.mega-menu-trigger'); 

    function updateScrollButtonState() {
        // --- This section for the scroll button remains unchanged ---
        if (!isBouncing) {
            isBouncing = true;
            scrollButton.addClass('is-bouncing');
            setTimeout(function() {
                scrollButton.removeClass('is-bouncing');
                isBouncing = false;
            }, 400);
        }

        let scrollTop = $(window).scrollTop();
        let docHeight = $(document).height();
        let winHeight = $(window).height();
        let scrollableHeight = docHeight - winHeight;
        let scrollPercent = scrollableHeight > 0 ? (scrollTop / scrollableHeight) * 100 : 100;
        let waterLevel = 100 - scrollPercent;
        scrollButton.css('--water-level', waterLevel + '%');

        var isAtBottom = (scrollTop + winHeight) >= (docHeight - 50);
        if (isAtBottom) {
            scrollButton.addClass('scroll-to-top');
        } else {
            scrollButton.removeClass('scroll-to-top');
        }

        // --- MODIFIED: Logic to hide trigger AND move scroll button ---
        if (footer.length && megaMenuTrigger.length) { 
            var footerTop = footer.offset().top;
            var windowBottom = scrollTop + winHeight;
            var buffer = 20; 

            if (windowBottom > (footerTop - buffer)) {
                // When near the footer: hide the menu trigger AND lower the scroll button
                megaMenuTrigger.fadeOut(200);
                scrollButton.addClass('is-lowered');
            } else {
                // Otherwise: show the menu trigger AND restore the scroll button's position
                megaMenuTrigger.fadeIn(200);
                scrollButton.removeClass('is-lowered');
            }
        }
    }

    // This click handler for the scroll button remains unchanged
    scrollButton.on('click', function(e) {
        e.preventDefault();
        if ($(this).hasClass('scroll-to-top')) {
            $('html, body').animate({ scrollTop: 0 }, 500);
        } else {
            $('html, body').animate({ scrollTop: $(window).scrollTop() + $(window).height() }, 500);
        }
    });

    $(window).on('scroll', updateScrollButtonState);
    updateScrollButtonState();
});
</script>				</div>
